[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyarb"
version = "0.1.0"
description = "Polymarket arbitrage observation + strategy toolkit"
requires-python = ">=3.12"
dependencies = [
  "httpx[http2]>=0.27,<0.28",
  "py-clob-client>=0.34.6,<0.35",
  "aiolimiter>=1.2,<2",
  "tenacity>=8.4,<9",
  "pyarrow>=17.0,<18",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<0.13",
  # click is a transitive dep of typer; click 8.2 changed Parameter.make_metavar()
  # signature (added required ctx arg), which typer 0.12.x calls without ctx and
  # crashes during --help rendering. Pin <8.2 until typer 0.13+ catches up.
  "click>=8.1,<8.2",
  "tqdm>=4.66,<5",
  "loguru>=0.7,<0.8",
  # Phase 1.1 T2 — translation client (AsyncOpenAI). Pinning <3 to avoid major-
  # version drift in the retry/timeout interface. Project supports any
  # OpenAI-compatible endpoint via TRANSLATION_API_BASE.
  "openai>=2.0,<3",
  # Phase 1.1 T3/T5 — terminal table rendering for scan / show output.
  "rich>=13,<14",
  # Phase 1.1 T4 — cross-snapshot parquet queries (diff/tracker). Promoted from
  # dev to main deps because production observation paths now depend on it.
  "duckdb>=1.0,<2",
  # Phase 1.1 T3 plan 03 — scanner returns DataFrame; formatter renders rich.Table
  # from DataFrame. pandas was a transitive dep before; pin it here so future
  # dependency changes don't accidentally drop it.
  "pandas>=2.0,<3",
  "starlette>=0.49,<0.50",
  "uvicorn[standard]>=0.32,<0.33",
  "sentry-sdk>=2.20,<3",
  "supabase>=2.10,<3",
  "boto3>=1.42,<2",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<0.24",
  "respx>=0.21,<0.22",
  "freezegun>=1.5,<2",
  "ruff>=0.5,<1",
  "psutil>=5.9,<7",
]

[project.scripts]
polyarb = "polyarb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/polyarb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: opt-in long-running tests (e.g. memory regression — runs via `make memory-budget-test`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "respx>=0.21.1",
]
