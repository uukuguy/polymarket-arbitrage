[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyarb"
version = "0.1.0"
description = "Polymarket arbitrage observation + strategy toolkit"
requires-python = ">=3.12"
dependencies = [
  "httpx[http2]>=0.27,<0.28",
  "py-clob-client>=0.34.6,<0.35",
  "aiolimiter>=1.2,<2",
  "tenacity>=8.4,<9",
  "pyarrow>=17.0,<18",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<0.13",
  # click is a transitive dep of typer; click 8.2 changed Parameter.make_metavar()
  # signature (added required ctx arg), which typer 0.12.x calls without ctx and
  # crashes during --help rendering. Pin <8.2 until typer 0.13+ catches up.
  "click>=8.1,<8.2",
  "tqdm>=4.66,<5",
  "loguru>=0.7,<0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<0.24",
  "respx>=0.21,<0.22",
  "duckdb>=1.0,<2",
  "freezegun>=1.5,<2",
  "ruff>=0.5,<1",
]

[project.scripts]
polyarb = "polyarb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/polyarb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
