# alembic.ini — Alembic configuration for Supabase Postgres schema management.
#
# Phase 02 Plan 03 — D-02 dashboard schema (narrow mirror, NOT 1:1 of SQLite).
#
# W6 fix: alembic uses POLYARB_SUPABASE_DB_DSN (Postgres DSN) which is DISTINCT
# from POLYARB_SUPABASE_URL (REST URL used by supabase-py SDK). Never use the REST
# URL in alembic — it's not a valid Postgres DSN.
#
# Usage:
#   export POLYARB_SUPABASE_DB_DSN="postgresql://postgres:[PW]@db.<ref>.supabase.co:5432/postgres"
#   make supabase-migrate         → alembic upgrade head
#
# sqlalchemy.url is intentionally EMPTY here — env.py loads the DSN from env var.
# (Setting it here would require hardcoding credentials into a tracked file — never do this.)

[alembic]
# Path to the alembic scripts directory (relative to this file)
script_location = alembic

# Do not set sqlalchemy.url here — env.py reads POLYARB_SUPABASE_DB_DSN at runtime
# (W6 fix: DB DSN is distinct from the REST URL used by supabase-py)
sqlalchemy.url =

# Template for new migration files
file_template = %%(rev)s_%%(slug)s

# Logger setup
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
