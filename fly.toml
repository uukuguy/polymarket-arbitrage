# Phase 02 Fly.io config — Supercronic cron (W8 RESOLVED, 2026-05-12)
app = "polyarb-l1"
primary_region = "ams"

[build]

[mounts]
  source = "polyarb_data"
  destination = "/data"
  initial_size = "5gb"

[env]
  POLYARB_DATA_DIR = "/data"
  POLYARB_SNAPSHOT_DIR = "/data/snapshots"
  POLYARB_DB_PATH = "/data/state.db"
  POLYARB_ALLOW_EXTERNAL_PATHS = "1"

# Two process groups — daemon (long-running HTTP+scheduler) + cron (Supercronic)
# Set count via: flyctl scale count app=1 cron=1
[processes]
  app = "python -m polyarb.daemon.main"
  cron = "supercronic /app/crontab"

# HTTP service — bound to "app" process group only (Supercronic does not serve HTTP).
# D-22 amendment: /scan + /health both public on Anycast; HMAC middleware is the auth gate.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

# VM sizing — based on prod OOM data (not synthetic profiling):
#   OOM at 387MB RSS with only 2400 events (offset=2400) on 512MB VM.
#   Real Gamma events/markets are ~160KB/obj in Python (50+ nested fields).
#   Subset mode fetches ~10k events + ~10k markets → peak ~600-700MB.
#   1GB gives ~1.5x headroom over worst-case subset peak.
#   Cost: shared-cpu-1x 1GB = $7.12/mo + Volume $0.75 = $7.87/mo.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["cron"]
