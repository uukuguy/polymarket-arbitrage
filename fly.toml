# Phase 02 Fly.io config — Supercronic cron (W8 RESOLVED, 2026-05-12)
app = "polyarb-l1"
primary_region = "ams"

[build]

[mounts]
  source = "polyarb_data"
  destination = "/data"
  initial_size = "5gb"

[env]
  POLYARB_DATA_DIR = "/data"
  POLYARB_SNAPSHOT_DIR = "/data/snapshots"
  POLYARB_DB_PATH = "/data/state.db"
  POLYARB_ALLOW_EXTERNAL_PATHS = "1"

# Two process groups — daemon (long-running HTTP+scheduler) + cron (Supercronic)
# Set count via: flyctl scale count app=1 cron=1
[processes]
  app = "python -m polyarb.daemon.main"
  cron = "supercronic /app/crontab"

# HTTP service — bound to "app" process group only (Supercronic does not serve HTTP).
# D-22 amendment: /scan + /health both public on Anycast; HMAC middleware is the auth gate.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# VM sizing — based on memory profiling (Plan 02-08 session):
#   Python baseline + all imports: 118 MB
#   Subset snapshot peak:          170 MB
#   Full mode peak:                300 MB
#   512 MB gives 1.7x headroom for full mode.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["cron"]
