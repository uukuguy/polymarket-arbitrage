# Phase 02 Fly.io config — Supercronic cron (W8 RESOLVED, 2026-05-12)
app = "polyarb-l1"
primary_region = "ams"

[build]

[mounts]
  source = "polyarb_data"
  destination = "/data"
  initial_size = "5gb"

[env]
  POLYARB_DATA_DIR = "/data"
  POLYARB_SNAPSHOT_DIR = "/data/snapshots"
  POLYARB_DB_PATH = "/data/state.db"
  POLYARB_ALLOW_EXTERNAL_PATHS = "1"

# Two process groups — daemon (long-running HTTP+scheduler) + cron (Supercronic)
# Set count via: flyctl scale count app=1 cron=1
[processes]
  app = "python -m polyarb.daemon.main"
  cron = "supercronic /app/crontab"

# HTTP service — bound to "app" process group only (Supercronic does not serve HTTP).
# D-22 amendment: /scan + /health both public on Anycast; HMAC middleware is the auth gate.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

# VM sizing — 2026-05-16 SESSION 19: settled on 512MB after Plan 02-09 streaming
# refactor. The streaming change (Gamma _paginate AsyncIterator + orchestrator
# per-page consume) is the real architecture fix — 20k raw markets no longer
# accumulate. But the data itself (target_markets ~25MB at $1k threshold +
# CLOB books/prices ~10MB + Python/pyarrow/httpx baseline ~120MB) puts peak
# RSS around 160-170MB, which is the edge of 256MB-with-150MB-usable. 256MB
# is marginal, 512MB is the right engineering call — $3.56/mo for ~240MB
# headroom that absorbs 2-3× data growth without revisiting this issue.
#
# Cron stays 256MB — supercronic is a small binary, no Python workload.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["cron"]
