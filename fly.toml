# Phase 02 Fly.io config — Supercronic cron (W8 RESOLVED, 2026-05-12)
app = "polyarb-l1"
primary_region = "ams"

[build]

[mounts]
  source = "polyarb_data"
  destination = "/data"
  initial_size = "5gb"

[env]
  POLYARB_DATA_DIR = "/data"
  POLYARB_SNAPSHOT_DIR = "/data/snapshots"
  POLYARB_DB_PATH = "/data/state.db"
  POLYARB_ALLOW_EXTERNAL_PATHS = "1"

# Two process groups — daemon (long-running HTTP+scheduler) + cron (Supercronic)
# Set count via: flyctl scale count app=1 cron=1
[processes]
  app = "python -m polyarb.daemon.main"
  cron = "supercronic /app/crontab"

# HTTP service — bound to "app" process group only (Supercronic does not serve HTTP).
# D-22 amendment: /scan + /health both public on Anycast; HMAC middleware is the auth gate.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

# VM sizing — 2026-05-16 SESSION 19 final: 1GB after empirical OOM observations.
#
# Plan 02-09 streaming refactor IS architecturally correct — the 20k raw Gamma
# response no longer accumulates. But empirical Linux RSS at production
# $1k threshold (6700 target_markets, 13400 CLOB tokens) tops out at 402MB
# anonymous RSS before kernel OOM-kills the daemon process:
#
#   [Linux OOM] Killed process 647 (python) total-vm:871344kB,
#     anon-rss:402364kB, file-rss:60kB ... oom_score_adj:0
#
# Fly cgroup limit includes kernel + container overhead, so a 512MB VM gives
# the user process ~400MB headroom — exactly where Plan 02-09's data-resident
# working set ends up. 1GB ($7.12/mo) gives ~900MB usable, easily absorbing
# 2× data growth and the periodic CLOB cache memory bursts.
#
# We are not chasing further memory savings on this data-collection daemon.
# It's a small program; the right tradeoff is paying for headroom rather than
# adding code complexity. If we ever care about cost per market, plan 02-10
# can revisit (multi-process snapshot? separate CLOB worker? lazy book fetch?).
#
# Cron stays 256MB — supercronic is a small binary, no Python workload.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["cron"]
