# Phase 02 Fly.io config — Supercronic cron (W8 RESOLVED, 2026-05-12)
app = "polyarb-l1"
primary_region = "ams"

[build]

[mounts]
  source = "polyarb_data"
  destination = "/data"
  initial_size = "5gb"

[env]
  POLYARB_DATA_DIR = "/data"
  POLYARB_SNAPSHOT_DIR = "/data/snapshots"
  POLYARB_DB_PATH = "/data/state.db"
  POLYARB_ALLOW_EXTERNAL_PATHS = "1"
  # Structure advances one durable Gamma page at a time. Interrupted runs resume
  # from the committed opaque cursor; only a complete certified window publishes.
  # Five minutes is the healthy cadence; recovery retries use a short bounded delay.
  POLYARB_SCHEDULER_INTERVAL_S = "300"
  POLYARB_STRUCTURE_SYNC_ENABLED = "true"
  # Protected maintenance release: cleanup must converge before the separate
  # generation-read and Quote cutovers are authorized.
  POLYARB_STRUCTURE_GENERATION_READ_MODE = "generation"
  # User-authorized public-read-only quote production for the certified M1→M2 feed.
  # This enables no wallet, signer, order, or execution capability.
  POLYARB_NEG_RISK_QUOTE_WORKER_ENABLED = "true"
  POLYARB_NEG_RISK_QUOTE_INTERVAL_S = "60"
  POLYARB_STRUCTURE_GENERATION_CLEANUP_ENABLED = "true"
  POLYARB_STRUCTURE_GENERATION_CLEANUP_MAX_ROWS = "500"
  POLYARB_STRUCTURE_GENERATION_CLEANUP_ACTIVE_INTERVAL_S = "0.05"
  POLYARB_STRUCTURE_GENERATION_CLEANUP_IDLE_INTERVAL_S = "30"
  POLYARB_STRUCTURE_GENERATION_CLEANUP_WRITER_BUSY_INTERVAL_S = "5"
  # Keep capacity incidents independently measured and receipt-gated through
  # recovery. The worker always yields to an active or due Quote collection.
  POLYARB_CAPACITY_CONTROLLER_ENABLED = "true"
  POLYARB_NEG_RISK_OBSERVE_MIN_EDGE_BPS = "100"
  POLYARB_NEG_RISK_FOCUSED_INTERVAL_S = "15"
  POLYARB_MARKET_MAP_MAX_AGE_S = "1800"
  POLYARB_NEG_RISK_OPPORTUNITY_RETENTION_DAYS = "30"

# Two process groups — daemon (long-running HTTP+scheduler) + cron (Supercronic)
# Set count via: flyctl scale count app=1 cron=1
[processes]
  app = "python -m polyarb.daemon.main"
  cron = "supercronic /app/crontab"

# HTTP service — bound to "app" process group only (Supercronic does not serve HTTP).
# D-22 amendment: /scan + /health both public on Anycast; HMAC middleware is the auth gate.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "10s"

# Capacity baseline — production evidence on 2026-07-31 showed the single
# shared vCPU could starve /healthz and even the parent's subprocess timeout
# while Structure finalized 118k markets. Two shared vCPUs keep HTTP/timeout
# control runnable alongside the low-priority child. The app needs 2GB because
# the 1GB cgroup still SIGKILLed the streaming finalizer when it overlapped the
# live 34k-token Quote feed; this is measured combined-process headroom.
#
# Cron stays 256MB because it only runs Polywatch and has no /data volume.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["cron"]
