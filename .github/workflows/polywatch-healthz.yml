name: Polywatch — Healthz Watcher
# Unified M1 production watcher. Every five minutes:
#   - externally verify the resident Fly cron machine exists and is started;
#     start it and deliver a critical Telegram incident when it is stopped
#   - poll L1 /healthz + /arbitrage/opportunities
#   - poll L2 /healthz with explicit L3 evidence gates
#   - probe the canonical Vercel Dashboard without following SSO redirects
#   - if L1 snapshot stale (>30 min), POST /control/unpause (HMAC) + Telegram
#   - aggregate any alert into one Telegram message
# See .planning/threads/polywatch-architecture.md for design context.
#
# Failure modes:
#   - script exit 1 -> Polywatch escalation itself failed (Telegram down etc).
#     GHA email fallback (no auto-recovery; manual investigate).
#   - script exit 0 -> either all green OR escalation succeeded; no GHA email.
#
# Cost: 15 min * 4 = 96 runs/day, ~30s each = 48 min GHA / day, well within
# the free-tier 2000 min/mo budget.
#
# Security note: secrets passed through env: blocks (T-03-01-01 same as
# supabase-keepalive.yml). No untrusted GitHub event inputs are used; the only
# workflow input (dry_run) is a typed bool, not interpolated into run: scripts.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (no Telegram push, no unpause)"
        type: boolean
        default: false

concurrency:
  group: polywatch-healthz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    name: poll M1 production + escalate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Typed bool input rendered into env (never inlined into run: scripts).
      # Safe because inputs.dry_run is type:boolean, not user-controlled text.
      POLYWATCH_DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fly control-plane client
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Verify and repair resident Polywatch
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          POLYARB_TELEGRAM_BOT_TOKEN: ${{ secrets.POLYARB_TELEGRAM_BOT_TOKEN }}
          POLYARB_TELEGRAM_CHAT_ID: ${{ secrets.POLYARB_TELEGRAM_CHAT_ID }}
        run: |
          if [ "${POLYWATCH_DRY_RUN}" = "1" ]; then
            python3 scripts/polywatch/resident_watchdog.py
          else
            python3 scripts/polywatch/resident_watchdog.py --repair
          fi

      - name: Run healthz watcher
        env:
          POLYARB_SCAN_SHARED_SECRET: ${{ secrets.POLYARB_SCAN_SHARED_SECRET }}
          POLYARB_TELEGRAM_BOT_TOKEN: ${{ secrets.POLYARB_TELEGRAM_BOT_TOKEN }}
          POLYARB_TELEGRAM_CHAT_ID: ${{ secrets.POLYARB_TELEGRAM_CHAT_ID }}
        run: python3 scripts/polywatch/healthz_watcher.py

      - name: Alert on escalation failure (GH email path)
        if: failure()
        run: |
          echo "::error::Polywatch escalation FAILED - Telegram or unpause path broken; investigate immediately"
          exit 1
