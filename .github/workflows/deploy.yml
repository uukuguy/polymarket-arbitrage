name: Deploy to Fly

on:
  push:
    branches: [main]
    # Operational evidence and learning updates must not restart the daemon.
    # A post-restart 24h quote window is release-bound, so docs-only deploys
    # would destroy valid continuity evidence without changing runtime code.
    paths-ignore:
      - '.planning/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: flyctl deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy
        run: >-
          flyctl deploy --remote-only --wait-timeout 600
          --env POLYARB_RELEASE_ID="${GITHUB_SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify and repair resident Polywatch
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          POLYARB_TELEGRAM_BOT_TOKEN: ${{ secrets.POLYARB_TELEGRAM_BOT_TOKEN }}
          POLYARB_TELEGRAM_CHAT_ID: ${{ secrets.POLYARB_TELEGRAM_CHAT_ID }}
        run: python3 scripts/polywatch/resident_watchdog.py --repair
      - name: Smoke test /health
        env:
          APP: polyarb-l1
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${APP}.fly.dev/health" >/dev/null; then
              echo "deploy healthy"
              exit 0
            fi
            sleep 6
          done
          echo "/health did not respond after 60s"
          flyctl logs --app "${APP}" --no-tail | tail -100
          exit 1
